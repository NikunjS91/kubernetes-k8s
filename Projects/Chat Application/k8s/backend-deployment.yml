apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: chat-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      namespace: chat-application
      labels:
        app: backend
    spec:
      containers:
        - name: chatapp-backend
          image: trainwithshubham/chatapp-backend:latest
          ports:
            - containerPort: 5001
          env:
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              value: "mongodb://root:password@mongodb:27017/dbname?authSource=admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatapp-secret
                  key: jwt
            - name: PORT  
              value: "5001"